<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Shortlister Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="brand"><a href="index.html">Trip <span>Shortlister</span></a></h1>
    <p class="tag">Turn a destination, dates and group into one filtered shortlist. Review it, correct it, then add the logistics.</p>
  </header>

  <div class="layout">
    <form class="form-panel" id="trip-form" novalidate>
      <div>
        <h2>Trip details</h2>
        <p class="example-note">Example trip prefilled &mdash; edit anything</p>
      </div>

      <div class="field">
        <label for="destination">Destination</label>
        <input type="text" id="destination" value="Salt Lake City, Utah" autocomplete="off">
      </div>

      <div class="field">
        <span class="lbl" id="dates-lbl">Dates</span>
        <div class="dates" role="group" aria-labelledby="dates-lbl">
          <input type="date" id="start" value="2026-10-16" aria-label="Start date">
          <input type="date" id="end" value="2026-10-18" aria-label="End date">
        </div>
        <span class="days-note" id="days-note"></span>
      </div>

      <div class="field">
        <span class="lbl" id="size-lbl">Group size</span>
        <div class="stepper" role="group" aria-labelledby="size-lbl">
          <button type="button" id="size-minus" aria-label="One fewer traveler">&minus;</button>
          <input type="number" id="size" min="1" max="60" value="3" inputmode="numeric" aria-label="Number of travelers">
          <button type="button" id="size-plus" aria-label="One more traveler">+</button>
          <output class="readout" id="size-readout" for="size"></output>
        </div>
      </div>

      <div class="field">
        <label for="who">Who is traveling? <span class="hint">Ages help with age-fit notes</span></label>
        <input type="text" id="who" value="3 adult women, ages 30s to 50s" autocomplete="off">
      </div>

      <div class="field">
        <label for="notes">Notes and expectations <span class="hint">Optional</span></label>
        <textarea id="notes">One medium-level hike. A mix of tourist highlights and local favorites. Fall colors if possible.</textarea>
      </div>

      <p class="form-error" id="form-error" role="alert"></p>
      <button type="submit" class="btn primary" id="generate">Generate the itinerary</button>
    </form>

    <section id="results" aria-live="polite" aria-label="Results"></section>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/planner.js"></script>
</body>
</html>
